services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.0
    container_name: p091-mediamtx
    restart: unless-stopped
    ports:
      # RTSP is not HTTP and must not be routed through Cloudflare.
      # Restrict inbound TCP/8554 at the host firewall to publisher IPs.
      - "8554:8554/tcp"
    environment:
      MEDIAMTX_PUBLISH_PASSWORD: ${MEDIAMTX_PUBLISH_PASSWORD:?MEDIAMTX_PUBLISH_PASSWORD is required}
      MEDIAMTX_READ_PASSWORD: ${MEDIAMTX_READ_PASSWORD:?MEDIAMTX_READ_PASSWORD is required}
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p091}
      POSTGRES_USER: ${POSTGRES_USER:-p091}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p091} -d ${POSTGRES_DB:-p091}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # Production runs the detector/VLM on the host NVIDIA GPU (Tesla T4).
    gpus: all
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      # Keep these safety-critical values in the deployment manifest as well as the
      # env file, so a copied development .env cannot silently downgrade the stack.
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-p091}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-p091}
      REDIS_URL: redis://redis:6379/0
      MODEL_WEIGHTS_PATH: /app/models/detector.pt
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ${MODEL_WEIGHTS_HOST_PATH:-./models/yolo26n.pt}:/app/models/detector.pt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health', headers={'Host': 'c4-cameradetection-091.id.vn'}))"]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
