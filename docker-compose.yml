services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Camera registry, uploaded videos, demo clips and zone config all live here, so
      # this must be a volume or every restart loses the operator's setup.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      # 90s start_period: the first request has to wait for YOLO weights to load, and a
      # container marked unhealthy during that window gets restarted into the same wait.
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
