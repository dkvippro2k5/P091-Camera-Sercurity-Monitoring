server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Single-page app: unknown paths are routes, not missing files.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The three settings below are what make MJPEG and SSE work through nginx.
        # Buffering on holds a never-ending response in memory and delivers nothing, so
        # the grid stays black and alerts arrive minutes late — or never.
        proxy_buffering off;
        proxy_cache off;
        # A live stream has no natural end; the default 60s read timeout would sever
        # every camera feed and the alert channel once a minute.
        proxy_read_timeout 24h;
    }
}
